<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BrowserPilot Demo</title>
    <script src="https://cdn.tailwindcss.com/latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/htmx.org@1.9.5/dist/htmx.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --fg-primary: #f1f5f9;
            --fg-secondary: #64748b;
            --accent: #8b5cf6;
            --border-color: #475569;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg-primary); color: var(--fg-primary); }
        .bg-gradient-primary { background: linear-gradient(135deg, var(--bg-primary) 0, var(--bg-secondary) 100%); }
        .accent-gradient { background: linear-gradient(135deg, var(--accent), #a78bfa); }
        .glass { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); }
        .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.3); }
        .transition-fast { transition: 150ms cubic-bezier(0.4, 0, 0.2, 1); }
        .focus-visible:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        .input-field {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--fg-primary);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }
        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background 150ms ease, transform 100ms ease;
        }
        .btn-primary:hover {
            background: #a78bfa;
            transform: translateY(-1px);
        }
        .btn-primary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .btn-outline {
            background: transparent;
            color: var(--fg-primary);
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 500;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 150ms ease;
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .error-msg { color: var(--danger); background: rgba(239, 68, 68, 0.1); border-radius: var(--radius); padding: 0.75rem; margin-bottom: 1rem; }
        .success-msg { color: var(--success); background: rgba(16, 185, 129, 0.1); border-radius: var(--radius); padding: 0.75rem; margin-bottom: 1rem; }
    </style>
</head>
<body class="min-h-screen">
    <!-- Skip link -->
    <a href="#main-content" class="sr-only">Skip to main content</a>
    
    <!-- Header (same as index) -->
    <header class="bg-bg-secondary/80 border-b border-border-color/50 sticky top-0 z-50" 
            style="background: rgba(30, 41, 59, 0.8) !important;">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-md bg-accent flex items-center justify-center">
                        <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <h1 class="text-xl font-bold tracking-tighter">BrowserPilot Demo</h1>
                </div>
                <div class="hidden md:flex items-center gap-4">
                    <a href="/" class="text-gray-300 hover:text-white transition-colors">Home</a>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main id="main-content" class="pt-20 pb-8">
        <!-- Form Card -->
        <div class="relative z-10 max-w-md mx-auto px-4 py-12">
            <div class="glass rounded-2xl p-8 backdrop-blur">
                <h2 class="text-3xl font-bold tracking-tighter mb-6">Create Account</h2>
                
                <!-- Error Message -->
                {% if error %}
                <div class="error-msg">
                    <svg class="h-4 w-4 mr-2" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14l-5-5 5-5 1.41 1.41L10 12l4.29 4.31L14.5 8.5z"/>
                    </svg>
                    {{ error }}
                </div>
                {% endif %}
                
                <!-- Form -->
                <form method="POST" action="/register" hx-post="/register" hx-target="this" hx-swap="outerHTML">
                    <div class="grid grid-cols-1 gap-4 mb-4">
                        <div>
                            <label class="block text-sm text-fg-secondary/60 mb-2">Username</label>
                            <input type="text" name="username" class="input-field" 
                                   placeholder="Enter username"
                                   required autocomplete="username">
                        </div>
                        <div>
                            <label class="block text-sm text-fg-secondary/60 mb-2">Email</label>
                            <input type="email" name="email" class="input-field"
                                   placeholder="Enter email"
                                   required autocomplete="email">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm text-fg-secondary/60 mb-2">Password</label>
                        <input type="password" name="password" class="input-field"
                               placeholder="Enter password"
                               minlength="6"
                               required autocomplete="new-password">
                        <p class="text-xs text-fg-secondary/60 mt-1">Minimum 6 characters</p>
                    </div>
                    <button type="submit" class="btn-primary w-full mt-4">
                        <svg class="h-4 w-4 mr-2" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        Create Account
                    </button>
                </form>
                
                <p class="text-center text-sm text-fg-secondary/60 mt-6">
                    Already have an account? <a href="/login" class="font-medium text-accent hover:underline">Login here</a>
                </p>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="bg-bg-secondary/70 border-t border-border-color/50 py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 text-sm text-fg-secondary">
                <span>BrowserPilot Demo v1.0.0</span>
                <span>100% free, no sign-up required</span>
            </div>
        </div>
    </footer>
    
    <script>lucide.createIcons();</script>
</body>
</html>
