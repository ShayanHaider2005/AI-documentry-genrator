<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DocuBot{% endblock %}</title>
    <link href="https://cdn.tailwindcss.com/latest" rel="stylesheet">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-gray-900 text-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="/" class="text-xl font-bold hover:underline">DocuBot Docs</a>
        <div class="hidden md:flex items-center gap-4">
            <a href="/" class="text-gray-300 hover:text-white">Home</a>
            <a href="/about" class="text-gray-300 hover:text-white">About</a>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto py-6 px-4">
    {% block content %}{% endblock %}
</main>

<footer class="bg-gray-100 text-gray-600 py-3 mt-auto text-center">
    <small>Generated from README.md • DocuBot Documentation</small>
</footer>

</body>
</html>
