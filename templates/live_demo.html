<!DOCTYPE html>
<html lang="en" data-theme="dark" class="reduction-motion">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrowserPilot - Live Demo</title>
    <script src="https://cdn.tailwindcss.com/latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.5/dist/htmx.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --fg-primary: #f1f5f9;
            --fg-secondary: #64748b;
            --accent: #8b5cf6;
            --border-color: #475569;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg-primary); color: var(--fg-primary); }
        .bg-gradient-primary { background: linear-gradient(135deg, var(--bg-primary) 0, var(--bg-secondary) 100%); }
        .accent-gradient { background: linear-gradient(135deg, var(--accent), #a78bfa); }
        .glass { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); }
        .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.3); }
        .transition-fast { transition: 150ms cubic-bezier(0.4, 0, 0.2, 1); }
        .focus-visible:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body class="min-h-screen reduction-motion">
    <a href="/" class="sr-only">Skip to main content</a>
    <header class="bg-bg-secondary/80 border-b border-border-color/50 sticky top-0 z-50" style="background: rgba(30, 41, 59, 0.8) !important;">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-md bg-accent flex items-center justify-center">
                        <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <h1 class="text-xl font-bold tracking-tighter">BrowserPilot</h1>
                </div>
                <div class="hidden md:flex items-center gap-4">
                    <a href="/api/templates/index" class="text-gray-300 hover:text-white transition-colors">Home</a>
                </div>
            </div>
        </div>
    </header>
    <main id="main-content" class="pt-20 pb-8">
        <div class="max-w-2xl mx-auto px-4 py-12">
            <div class="glass rounded-2xl p-8 backdrop-blur">
                <h2 class="text-3xl font-bold tracking-tighter mb-4">Start Free Test</h2>
                <p class="text-fg-secondary/60 mb-6">
                    Enter a URL and describe what you want to test. No signup required.
                </p>
                <form id="demo-form" hx-post="/api/run-test" hx-target="#demo-results" hx-swap="outerHTML">
                    <div class="grid grid-cols-1 gap-4 mb-4">
                        <input type="url" id="url-input" required
                            class="input-field w-full"
                            placeholder="https://example.com"
                            hx-target="#demo-results"
                            hx-swap="outerHTML"
                            required>
                    </div>
                    <textarea id="goal-input" rows="3"
                        class="input-field w-full"
                        hx-target="#demo-results"
                        hx-swap="outerHTML"
                        required
                        placeholder="e.g., Check that the registration form works and validates emails"></textarea>
                    <button type="submit"
                        class="btn btn-primary w-full">
                        <svg class="h-4 w-4 mr-2" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 5v14M5 12h14"/>
                        </span>Run Test</button>
                </form>
                <div id="demo-results" class="mt-4 hidden">
                    <div class="p-4 rounded-lg glass" id="demo-result-content">
                        <p>Loading test results...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-bg-secondary/70 border-t border-border-color/50 py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 text-sm text-fg-secondary">
                <span>BrowserPilot v1.0.0</span>
                <span>100% free, no sign-up required</span>
            </div>
        </div>
    </footer>
    <script>lucide.createIcons();</script>
</body>
</html>
