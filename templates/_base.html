<!doctype html>
<html lang="en" data-theme="dark" class="reduction-motion">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BrowserPilot - AI Browser Automation & Bug Injection Platform">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="{% block og_title %}BrowserPilot{% endblock %}">
    <meta property="og:description" content="{% block og_desc %}AI Browser Automation{% endblock %}">
    <meta property="og:image" content="{% block og_image %}/static/images/og-image.png{% og_image %}">
    <meta property="og:url" content="{% block og_url %}http://127.0.0.1:8000{% og_url %}">
    <meta property="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}BrowserPilot{% twitter_title %}">
    <meta name="twitter:description" content="{% block twitter_desc %}AI Browser Automation{% twitter_desc %}">
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com/latest"></script>
    
    <!-- Alpine.js CDN -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.5/dist/htmx.js"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- JetBrains Mono for code blocks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --fg-primary: #f1f5f9;
            --fg-secondary: #94a3b8;
            --accent: #8b5cf6; /* electric violet */
            --accent-glow: rgba(139, 92, 246, 0.4);
            --border-color: #475569;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --radius: 16px;
            --radius-sm: 12px;
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--fg-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Reduce motion */
        [data-reduce-motion] * {
            transition-duration: 0s !important;
            animation-duration: 0s !important;
            transition-timing-function: linear !important;
        }
        
        /* Glassmorphism */
        .glass {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* Gradient background */
        .bg-gradient-primary {
            background: linear-gradient(135deg, #0f172a 0, #1e293b 100%);
        }
        
        /* Accent gradient */
        .accent-gradient {
            background: linear-gradient(135deg, var(--accent), #a78bfa);
        }
        
        /* Noise overlay */
        .noise-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        
        /* Spotlight effect */
        .spotlight {
            position: relative;
        }
        
        .spotlight::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }
        
        /* Skeleton loader */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-secondary) 50%, var(--bg-tertiary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Toast container */
        #toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        /* Focus visible */
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        /* Reduced motion media query */
        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0s !important;
                animation-duration: 0s !important;
            }
            .spotlight::after {
                animation: none;
            }
        }
        
        /* Scrollbar */
       ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
       ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        
       ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        
       ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
    
    {% block head_extras %}{% endblock %}
</head>
<body class="min-h-screen">
    <!-- Noise overlay -->
    <div class="noise-overlay" aria-hidden="true"></div>
    
    <!-- Skip link -->
    <a href="#main-content" class="sr-only skip-link skip-focusable":focus">Skip to main content</a>
    
    <!-- Top bar -->
    <header class="bg-bg-secondary/80 border-b border-border-color/50 sticky top-0 z-50" style="background: rgba(15, 23, 42, 0.8) !important;">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo / App name -->
                <div class="flex items-center gap-3">
                    <svg class="h-6 w-6 text-accent" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    <span class="text-lg font-semibold tracking-tighter">{% block app_name %}BrowserPilot{% endblock %}</span>
                </div>
                
                <!-- Topbar actions -->
                <div class="flex items-center gap-4">
                    <!-- Theme toggle -->
                    <button id="theme-toggle" 
                            class="p-2 rounded-md hover:bg-bg-tertiary transition-colors" 
                            aria-label="Toggle theme"
                            hx-get="/api/theme/toggle"
                    >
                        <svg id="theme-sun" class="h-5 w-5 hidden" viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="12" r="5"/>
                            <path d="M12 1v4M12 20v4M4.22 4.22l1.42 1.42M16 16l1.41-1.41M1 12l4v4M20 12l-4v4M4.22 19.78l1.42-1.42M2 8l4v4M16 8l-1.41 1.41M12 20l4-4V4M12 4l-4 4V12"/>
                        </svg>
                        <svg id="theme-moon" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    
                    <!-- Reduce motion toggle -->
                    <button id="reduce-motion-toggle" 
                            class="p-2 rounded-md hover:bg-bg-tertiary transition-colors"
                            aria-label="Toggle reduce motion"
                    >
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M9 10v6h4v4h12v-4h4v-6h-5l-3-9H5l-3 9H9zm3-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 2c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                    
                    <!-- Notifications -->
                    <button id="notifications-btn" 
                            class="relative p-2 rounded-md hover:bg-bg-tertiary"
                            aria-label="Notifications"
                    >
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 22c1.1 0 2.2-.4 3.1-.8L20 12l-8-7-8 7-8-7 1.9-5.2C8.4 5.4 9.5 5 12 5c2.5 0 4.5 2 4.5 4.5s-2 4.5-4.5 4.5L2 7l-4 5 5 8.1zm-2-8c-5.52 3.18-5.65 3.72-.05 6.08 2.35 1.22 5.32 1.08 6.73.35L12 10l-1.37 3.06c-1.41.7-3.17.38-3.85-.65L2 10c-1.1 0-2.2.4-3.1.8C.63 11.67.5 12.65.5 14s.13 2.33.47 3.53l1.86 5.77c.37.98.96 1.68 1.77 1.89 1.5.32 2.77-.08 3.57-.97L12 18l1.06-2.88c.7-1.08 2.3-1.3 3.38-.68 1.03.63 2.1.93 3.22.64.29-.09.57-.25.78-.5l.19-.38c3.18-2.08 3.28-5.09 1.36-7.95z"/>
                        </svg>
                        <span id="notifications-count" class="absolute -top-1 -right-1 bg-danger text-xs text-white rounded-full w-3 h-3">0</span>
                    </button>
                    
                    <!-- User menu / avatar -->
                    <div class="hidden items-center gap-2">
                        <button class="avatar avatar-sm" aria-label="User menu">
                            <div class="w-6 h-6 rounded-full bg-accent flex items-center justify-center">
                                <span class="text-sm font-medium text-white">U</span>
                            </div>
                        </button>
                        <span class="text-sm text-fg-secondary">User</span>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Main content area -->
    <main id="main-content" class="pt-20 pb-8">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="bg-bg-secondary/70 border-t border-border-color/50 py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 text-sm text-fg-secondary">
                <span>BrowserPilot v{VERSION}</span>
                <span>100% free, no sign-up required</span>
            </div>
        </div>
    </footer>
    
    <!-- Toast container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    
<!-- Reduce motion preference switch -->
<script>
    // Check for user preference
    const prefersReduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const storedPreference = localStorage.getItem('reduce-motion');
    
    if (storedPreference) {
        document.documentElement.dataset.reduceMotion = storedPreference;
    } else if (prefersReduceMotion) {
        document.documentElement.dataset.reduceMotion = 'true';
    }
    
    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    const themeSun = document.getElementById('theme-sun');
    const themeMoon = document.getElementById('theme-moon');
    
    // Check stored theme or system preference
    const storedTheme = localStorage.getItem('theme');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    if (storedTheme === 'light' || (!storedTheme && !systemDark)) {
        document.documentElement.classList.add('light');
        themeSun.classList.add('hidden');
        themeMoon.classList.remove('hidden');
    }
    
    themeToggle.addEventListener('click', () => {
        if (document.documentElement.classList.contains('light')) {
            document.documentElement.classList.remove('light');
            localStorage.setItem('theme', 'dark');
            themeSun.classList.add('hidden');
            themeMoon.classList.remove('hidden');
        } else {
            document.documentElement.classList.add('light');
            localStorage.setItem('theme', 'light');
            themeSun.classList.remove('hidden');
            themeMoon.classList.add('hidden');
        }
    });
    
    // Reduce motion toggle
    const reduceMotionToggle = document.getElementById('reduce-motion-toggle');
    const html = document.documentElement;
    
    if (localStorage.getItem('reduce-motion') === 'true') {
        html.dataset.reduceMotion = 'true';
    }
    
    reduceMotionToggle.addEventListener('click', () => {
        const shouldReduce = html.dataset.reduceMotion === 'true';
        html.dataset.reduceMotion = shouldReduce ? 'false' : 'true';
        localStorage.setItem('reduce-motion', html.dataset.reduceMotion);
    });
    
    // Initialize Lucide icons
    lucide.createIcons();
</script>
</body>
</html>
